name: Update LTN All Paper RSS

on:
  schedule:
    # 第一階段：深夜提前觸發（抵銷 GitHub 4~6 小時尖峰延遲，讓實際執行時間剛好落在 JST 05:30~06:45）
    - cron: '12 15 * * *'   # JST 00:12 / TWN 23:12
    - cron: '47 15 * * *'   # JST 00:47 / TWN 23:47
    - cron: '23 16 * * *'   # JST 01:23 / TWN 00:23
    - cron: '53 16 * * *'   # JST 01:53 / TWN 00:53
    - cron: '31 17 * * *'   # JST 02:31 / TWN 01:31
    - cron: '18 18 * * *'   # JST 03:18 / TWN 02:18

    # 第二階段：自由時報報紙版上架後至上班前密集掃描（若當天未塞車則直接準時抓取）
    - cron: '41 19 * * *'   # JST 04:41 / TWN 03:41
    - cron: '16 20 * * *'   # JST 05:16 / TWN 04:16
    - cron: '51 20 * * *'   # JST 05:51 / TWN 04:51
    - cron: '24 21 * * *'   # JST 06:24 / TWN 05:24
    - cron: '14 23 * * *'   # JST 08:14 / TWN 07:14
  workflow_dispatch:

# 防止多班次因延遲同時重疊執行造成衝突
concurrency:
  group: update-ltn-rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper script
        run: python main.py

      - name: Commit and push all XML files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update all paper XML feeds" && git push)
