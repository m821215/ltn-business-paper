name: Update LTN All Paper RSS

on:
  schedule:
    # 第一班：UTC 21:42 = 日本時間 06:42 / 台灣時間 05:42（避開整點尖峰）
    - cron: '42 21 * * *'
    # 第二班備援：UTC 22:23 = 日本時間 07:23 / 台灣時間 06:23
    - cron: '23 22 * * *'
  workflow_dispatch:

# 防止同時重複執行造成 Git 衝突
concurrency:
  group: update-ltn-rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper script
        run: python main.py

      - name: Commit and push all XML files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update all paper XML feeds" && git push)
