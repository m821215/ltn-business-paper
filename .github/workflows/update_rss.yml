name: Update LTN All Paper RSS

on:
  schedule:
    # 【階段一】重度延遲補償區（提前 7~8.5 小時，抵銷跨夜大塞車）
    - cron: '14 12 * * *'   # JST 21:14 / TWN 20:14
    - cron: '52 12 * * *'   # JST 21:52 / TWN 20:52
    - cron: '29 13 * * *'   # JST 22:29 / TWN 21:29
    - cron: '08 14 * * *'   # JST 23:08 / TWN 22:08
    - cron: '49 14 * * *'   # JST 23:49 / TWN 22:49

    # 【階段二】中度延遲補償區（提前 3~5.5 小時，抵銷一般夜間排隊）
    - cron: '37 15 * * *'   # JST 00:37 / TWN 23:37
    - cron: '19 16 * * *'   # JST 01:19 / TWN 00:19
    - cron: '44 17 * * *'   # JST 02:44 / TWN 01:44
    - cron: '28 18 * * *'   # JST 03:28 / TWN 02:28

    # 【階段三】原始目標黃金區（系統無延遲時，於報紙上架後準時抓取）
    - cron: '43 19 * * *'   # JST 04:43 / TWN 03:43
    - cron: '17 20 * * *'   # JST 05:17 / TWN 04:17
    - cron: '51 20 * * *'   # JST 05:51 / TWN 04:51
    - cron: '23 21 * * *'   # JST 06:23 / TWN 05:23

    # 【階段四】稍微延後備援區（確保上班前完成最終補抓）
    - cron: '52 21 * * *'   # JST 06:52 / TWN 05:52
    - cron: '26 22 * * *'   # JST 07:26 / TWN 06:26
    - cron: '48 23 * * *'   # JST 08:48 / TWN 07:48
  workflow_dispatch:

# 防止多班次因延遲同時釋放時重疊寫入衝突
concurrency:
  group: update-ltn-rss
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper script
        run: python main.py

      - name: Commit and push all XML files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update all paper XML feeds" && git push)
