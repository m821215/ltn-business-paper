name: Update LTN Business Paper RSS

on:
  schedule:
    # 每天台灣時間 06:00 (UTC 22:00) 自動執行
    - cron: '0 22 * * *'
  workflow_dispatch: # 允許手動點擊按鈕隨時測試

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper script
        run: python main.py

      - name: Commit and push XML
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add business_paper.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update business_paper.xml" && git push)
